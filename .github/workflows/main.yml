name: Build MadLibs

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build EXE
      run: pyinstaller --onefile --windowed ../../MadLibs/madlibs.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: MadLibs-Windows
        path: ../../MadLibs/dist/madlibs.exe


  build-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build APP
      run: pyinstaller --windowed --name MadLibs ../../MadLibs/madlibs.py

    - name: Upload APP
      uses: actions/upload-artifact@v4
      with:
        name: MadLibs-Mac
        path: ../../MadLibs/dist/MadLibs.app
