name: Build MadLibs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build .app
        working-directory: MadLibs
        run: |
          pyinstaller --windowed --name MadLibs madlibs.py

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: MadLibs-macOS
          path: MadLibs/dist/MadLibs.app
